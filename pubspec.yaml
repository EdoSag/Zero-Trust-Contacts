name: zerotrust_contacts
description: "Zero-Trust Contacts: an end-to-end encrypted address book."
publish_to: none
version: 1.4.0+6

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: 4af4c3b21f61d7ba974899c4a0498406001efec8 # v0.7.2 (switch to the tag once it's pushed)
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0
  sqlite3: ^3.7.0
  cryptography: ^2.7.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  # Tesseract: open-source text recognition that runs fully on the phone.
  flutter_tesseract_ocr: ^0.4.31
  file_picker: ^13.3.2
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ">=2.1.2 <2.2.0"
  flutter_contacts: ">=1.1.9 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    # On-device text recognition for business cards (English and Hebrew).
    - assets/tessdata_config.json
    - assets/tessdata/

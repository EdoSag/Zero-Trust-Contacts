name: zerotrust_contacts
description: "Zero-Trust Contacts: an end-to-end encrypted address book."
publish_to: none
version: 1.8.0+21

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Dates and numbers; the version comes with flutter_localizations.
  intl: any
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: 08eccf33e5989c0efceba67d351159b979ae0740
  # The shared invite, join and people screens (shared address books, C11).
  zt_sharing_ui:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_sharing_ui
      ref: 08eccf33e5989c0efceba67d351159b979ae0740
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Reset links from account emails (EmailLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0
  sqlite3: ^3.7.0
  cryptography: ^2.7.0
  # The desktop bridge's TLS certificate (C10), and its ETags.
  basic_utils: ^5.8.2
  crypto: ^3.0.6
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  # Tesseract: open-source text recognition that runs fully on the phone.
  flutter_tesseract_ocr: ^0.4.31
  file_picker: ^13.3.2
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ">=2.1.2 <2.2.0"
  flutter_contacts: ">=1.1.9 <2.0.0"
  # Birthday and anniversary reminders (C6), same plugin as ZT Calendar.
  # 22.x: 23 needs Android Gradle plugin 9 and compileSdk 37.
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: b43fcd045722bc364ef2eaa739db181f9dac144f
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    # On-device text recognition for business cards (English and Hebrew).
    - assets/tessdata_config.json
    - assets/tessdata/
